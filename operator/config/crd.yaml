apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bitwardensecrets.k8s.bitwarden.com
spec:
  group: k8s.bitwarden.com
  names:
    kind: BitwardenSecret
    listKind: BitwardenSecretList
    plural: bitwardensecrets
    singular: bitwardensecret
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [organizationId, secretName, authToken]
              properties:
                organizationId:
                  type: string
                secretName:
                  type: string
                projectId:
                  type: string
                onlyMappedSecrets:
                  type: boolean
                useSecretNames:
                  type: boolean
                map:
                  type: array
                  items:
                    type: object
                    properties:
                      bwSecretId:
                        type: string
                      secretKeyName:
                        type: string
                authToken:
                  type: object
                  required: [secretName, secretKey]
                  properties:
                    secretName:
                      type: string
                    secretKey:
                      type: string
            status:
              type: object
              properties:
                lastSuccessfulSyncTime:
                  type: string
