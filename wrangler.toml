name = "nodewarden"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

[build]
command = "npm run build:admin && npm run build:assets"

# The official web vault plus our own connector pages, assembled by scripts/build-worker-assets.mjs.
# Cloudflare serves them directly on this origin, so passkeys share one relying-party ID. The Worker runs
# first only for the backend paths in shared/backend-paths.ts, the admin portal and our own pages, which
# need its security headers (only the WebAuthn iframe connector may be framed).
[assets]
binding = "ASSETS"
directory = "./dist/worker-assets"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api",
  "/api/*",
  "/identity",
  "/identity/*",
  "/icons",
  "/icons/*",
  "/fill-assist",
  "/fill-assist/*",
  "/notifications",
  "/notifications/*",
  "/events",
  "/events/*",
  "/accounts",
  "/accounts/*",
  "/organizations",
  "/organizations/*",
  "/two-factor",
  "/two-factor/*",
  "/devices",
  "/devices/*",
  "/auth-requests",
  "/auth-requests/*",
  "/webauthn",
  "/webauthn/*",
  "/scim",
  "/scim/*",
  "/v2",
  "/v2/*",
  "/connect",
  "/connect/*",
  "/sso",
  "/sso/*",
  "/oidc-signin",
  "/oidc-signin/*",
  "/licenses",
  "/licenses/*",
  "/plans",
  "/plans/*",
  "/emergency-access",
  "/emergency-access/*",
  "/v1/assetlinks:check",
  "/web-bootstrap",
  "/config",
  "/alive",
  "/settings/domains",
  "/admin",
  "/admin/*",
  "/sso-connector.html",
  "/webauthn-connector.html",
  "/webauthn-fallback-connector.html",
  "/webauthn-mobile-connector.html",
]

[triggers]
crons = [ "*/5 * * * *" ]

[vars]
ALLOW_OPEN_REGISTRATION = "1"
WEB_VAULT_ORIGINS = "https://nodewarden.stevefan1999.workers.dev"
EMAIL_FROM = "noreply@stevefan1999.tech"
EMAIL_FROM_NAME = "NodeWarden"

[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"
database_id = "7f33ae0e-0f62-4e5b-914f-dd22350f36cd"
# drizzle-kit v1 writes one folder per migration; the pattern opts wrangler in.
migrations_dir = "migrations"
migrations_pattern = "migrations/*/migration.sql"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

[[durable_objects.bindings]]
name = "BACKUP_TRANSFER_RUNNER"
class_name = "BackupTransferRunner"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

# Per-minute budgets for RateLimitService.consumeBudget, one per distinct limit in src/config/limits.ts:
# 30 refresh per session, 60 public, 120 public read, 200 authenticated API, 300 refresh per IP, 500 icons.
[[ratelimits]]
name = "RATE_LIMIT_30_PER_MINUTE"
namespace_id = "7301"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_60_PER_MINUTE"
namespace_id = "7302"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_120_PER_MINUTE"
namespace_id = "7303"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_200_PER_MINUTE"
namespace_id = "7304"
simple = { limit = 200, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_300_PER_MINUTE"
namespace_id = "7305"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RATE_LIMIT_500_PER_MINUTE"
namespace_id = "7306"
simple = { limit = 500, period = 60 }

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]

[[migrations]]
tag = "v2-backup-transfer-runner"
new_sqlite_classes = [ "BackupTransferRunner" ]

[[migrations]]
tag = "v3-organization-directory"
new_sqlite_classes = [ "OrganizationHub", "DirectorySyncActor" ]

[[migrations]]
tag = "v4-drop-organization-directory"
deleted_classes = [ "OrganizationHub", "DirectorySyncActor" ]
