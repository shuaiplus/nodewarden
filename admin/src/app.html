<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font: 16px system-ui, sans-serif;
        max-width: 72rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #182230;
        background: #f5f7fa;
      }
      main {
        background: white;
        padding: 2rem;
        border: 1px solid #dce1e8;
        border-radius: 8px;
      }
      a {
        color: #1649a6;
      }
      nav {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      label {
        display: block;
        margin: 1rem 0;
      }
      input,
      button {
        font: inherit;
        padding: 0.5rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 1rem 0;
      }
      th,
      td {
        text-align: left;
        border-bottom: 1px solid #dce1e8;
        padding: 0.5rem;
        overflow-wrap: anywhere;
      }
      dt {
        font-weight: bold;
        margin-top: 0.75rem;
      }
      dd {
        margin-left: 0;
        overflow-wrap: anywhere;
      }
      .notice {
        padding: 1rem;
        background: #fff4d6;
      }
    </style>
    %sveltekit.head%
  </head>
  <body>
    %sveltekit.body%
  </body>
</html>
